<meta charset="utf-8">
<title>홈코트 앱 아이콘 시안 v4 — E안 선 농도</title>
<style>
  body{margin:0;padding:26px 30px;background:#1b1d22;color:#e6e8ee;
       font:14px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
  h1{font-size:17px;margin:0 0 4px}
  .sub{font-size:12.5px;opacity:.62;margin-bottom:20px;max-width:840px}
  .sub b{color:#FFC46B}
  table{border-collapse:collapse}
  th{font-size:11px;opacity:.5;font-weight:600;padding:0 14px 10px;text-align:center}
  td{padding:10px 14px;text-align:center;vertical-align:middle}
  td.name{text-align:left;font-size:12.5px;font-weight:700;white-space:nowrap}
  td.name em{display:block;font-style:normal;font-weight:400;font-size:11px;opacity:.5;margin-top:2px}
  .ico{border-radius:22.37%;display:inline-block}
  .mask{border-radius:50%;display:inline-block}
  .big{image-rendering:pixelated}
  tr+tr td{border-top:1px solid #ffffff12}
  .home{background:linear-gradient(160deg,#5d6b8a,#8d7f70);padding:10px;border-radius:16px;display:inline-block}
</style>

<h1>홈코트 앱 아이콘 시안 v4 — E안, 선 농도 비교</h1>
<div class="sub">
  E안(자유투 서클 중심)으로 확정. 남은 것은 <b>흰 선의 농도</b>입니다.
  스플래시 로고는 <b>ink-3 = 40%</b>인데, 그 값은 어두운 화면 위 82px에서 정해진 것이라
  홈 화면 40px에서도 남는지 확인합니다. 앰버 서클은 어느 쪽이든 그대로입니다.
</div>

<table>
  <tr><th></th><th>40px<br>(목록)</th><th>60px<br>(홈 화면)</th><th>40px를 6배로</th><th>원형 크롭</th><th>홈 화면 위</th></tr>
  <tbody id="out"></tbody>
</table>

<script>
function art(line, w){ return `
  <rect x="5" y="9" width="38" height="30" rx="5" stroke="${line}" stroke-width="${2.4*w}" fill="none"/>
  <path d="M5 18h10v12H5" stroke="${line}" stroke-width="${2.4*w}" stroke-linejoin="round" fill="none"/>
  <circle cx="15" cy="24" r="5.5" stroke="#FFA31A" stroke-width="${2.8*w}" fill="none"/>
  <path d="M43 17.5a6.5 6.5 0 0 0 0 13" stroke="${line}" stroke-width="${2.4*w}" fill="none"/>`
}
const BOX = [3, 10.5, 26]   // E안 — 자유투 서클 중심
function svg(line, w, inset=1){
  const [x,y,s] = BOX
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${s} ${s}">
    <rect x="${-x}" y="${-y}" width="200" height="200" fill="#0B0E15"/>
    <g transform="translate(${s/2} ${s/2}) scale(${inset}) translate(${-s/2} ${-s/2})">
      <g transform="translate(${-x} ${-y})">${art(line,w)}</g>
    </g>
  </svg>`
}
const V = [
  ['E-40', '스플래시와 같은 40% (ink-3)', 'rgba(233,238,247,.40)'],
  ['E-55', '55%', 'rgba(233,238,247,.55)'],
  ['E-70', '70%', 'rgba(233,238,247,.70)'],
  ['E-80', '80% (v3에서 본 것)', 'rgba(233,238,247,.80)'],
]
const out = document.getElementById('out')
V.forEach(([k, name, line]) => {
  const url  = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg(line, 0.85))
  const murl = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg(line, 0.85, 0.8))
  const tr = document.createElement('tr')
  tr.innerHTML = `
    <td class="name">${k}<em>${name}</em></td>
    <td><img class="ico" src="${url}" width="40" height="40"></td>
    <td><img class="ico" src="${url}" width="60" height="60"></td>
    <td><canvas class="big" data-src="${url}" width="40" height="40"
                style="width:220px;height:220px;border-radius:22.37%"></canvas></td>
    <td><canvas class="big" data-src="${murl}" width="40" height="40"
                style="width:140px;height:140px;border-radius:50%"></canvas></td>
    <td><span class="home"><img class="ico" src="${url}" width="60" height="60"></span></td>`
  out.appendChild(tr)
})
document.querySelectorAll('canvas').forEach(cv => {
  const im = new Image()
  im.onload = () => cv.getContext('2d').drawImage(im, 0, 0, 40, 40)
  im.src = cv.dataset.src
})
</script>
