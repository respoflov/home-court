<meta charset="utf-8">
<title>홈코트 앱 아이콘 시안 v2</title>
<style>
  body{margin:0;padding:28px 32px;background:#1b1d22;color:#e6e8ee;
       font:14px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
  h1{font-size:17px;margin:0 0 4px}
  .sub{font-size:12.5px;opacity:.6;margin-bottom:8px;max-width:820px}
  .sub b{color:#FFC46B}
  h2{font-size:13.5px;margin:28px 0 3px}
  .note{font-size:11.5px;opacity:.5;margin-bottom:12px}
  .row{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
  .item{text-align:center}
  .item span{display:block;font-size:10px;opacity:.45;margin-top:6px;line-height:1.3}
  .ico{border-radius:22.37%;display:block}
  .mask{border-radius:50%;display:block}
  .home{background:linear-gradient(160deg,#5d6b8a,#8d7f70);padding:14px 16px;border-radius:18px;
        display:flex;gap:12px;align-items:center}
  .home span{font-size:10px;opacity:.8;color:#fff}
  hr{border:0;border-top:1px solid #ffffff14;margin:24px 0}
</style>

<h1>홈코트 앱 아이콘 시안 v2</h1>
<div class="sub">
  v1에서 본 문제: 코트 테두리(둥근 사각형)가 <b>아이콘 자체의 둥근 사각형과 겹쳐</b> 40px에서 뭉갰고,
  오른쪽 센터 아크가 가장자리에 붙어 흠집처럼 보였습니다. 그래서 <b>같은 그림을 더 가까이서 잡은 크롭 안</b>을 나란히 놓습니다.
</div>
<div class="sub">
  판단 기준은 <b>40px</b>과 <b>원형 크롭(안드로이드)</b>입니다. 128px은 참고용입니다.
</div>

<div id="out"></div>

<script>
/* 좌표는 진입 화면 로고(src/components/bits.tsx 의 Logo)와 같다.
   코트 테두리 · 왼쪽 페인트존 · 자유투 서클 · 오른쪽 센터 아크 */
function art(line, w){ return `
  <rect x="5" y="9" width="38" height="30" rx="5" stroke="${line}" stroke-width="${2.4*w}" fill="none"/>
  <path d="M5 18h10v12H5" stroke="${line}" stroke-width="${2.4*w}" stroke-linejoin="round" fill="none"/>
  <circle cx="15" cy="24" r="5.5" stroke="#FFA31A" stroke-width="${2.8*w}" fill="none"/>
  <path d="M43 17.5a6.5 6.5 0 0 0 0 13" stroke="${line}" stroke-width="${2.4*w}" fill="none"/>`
}
/* box = 잘라낼 영역 [x y w h]. 전체를 담으면 로고 그대로, 좁히면 크롭 */
function svg(line, w, box, bg='#0B0E15', inset=1){
  const [x,y,s] = box
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${s} ${s}">
    <rect x="${-x}" y="${-y}" width="200" height="200" fill="${bg}"/>
    <g transform="translate(${s/2} ${s/2}) scale(${inset}) translate(${-s/2} ${-s/2})">
      <g transform="translate(${-x} ${-y})">${art(line,w)}</g>
    </g>
  </svg>`
}

const LINE = 'rgba(233,238,247,.80)'
const V = [
  ['C', '로고 전체 (v1의 C)', LINE, 1.08, [-1.5, 4.5, 51]],
  ['D', '왼쪽 절반 크롭 · 코트가 프레임 밖으로 이어짐', LINE, 1.0, [0.5, 5.5, 37]],
  ['E', '자유투 서클 중심 · 가장 가까이', LINE, 0.85, [3, 10.5, 26]],
]
const SIZES = [128, 60, 40]

let h = ''
for (const [k, name, line, w, box] of V){
  const url = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg(line, w, box))
  // maskable: 가장자리 10%를 비운다 = 그림을 0.8배로 줄이고 배경은 꽉 채운다
  const murl = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg(line, w, box, '#0B0E15', 0.8))
  h += `<h2>${k}. ${name}</h2><div class="note">잘라낸 영역 [${box.join(', ')}] · 선 굵기 ×${w}</div><div class="row">`
  for (const px of SIZES)
    h += `<div class="item"><img class="ico" src="${url}" width="${px}" height="${px}"><span>${px}px</span></div>`
  h += `<div class="item"><img class="mask" src="${murl}" width="60" height="60"><span>maskable<br>원형 크롭</span></div>`
  h += `<div class="item"><img class="ico" src="${murl}" width="60" height="60"><span>maskable<br>사각 크롭</span></div>`
  h += `<div class="home"><img class="ico" src="${url}" width="60" height="60">
        <span>홈 화면<br>배경 위</span></div>`
  h += `</div><hr>`
}
document.getElementById('out').innerHTML = h
</script>
