<meta charset="utf-8">
<title>홈코트 앱 아이콘 시안 v3 — 가장 작은 크기 검수</title>
<style>
  body{margin:0;padding:26px 30px;background:#1b1d22;color:#e6e8ee;
       font:14px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
  h1{font-size:17px;margin:0 0 4px}
  .sub{font-size:12.5px;opacity:.6;margin-bottom:22px;max-width:820px}
  table{border-collapse:collapse}
  th{font-size:11px;opacity:.5;font-weight:600;padding:0 14px 10px;text-align:center}
  td{padding:10px 14px;text-align:center;vertical-align:middle}
  td.name{text-align:left;font-size:12.5px;font-weight:700;white-space:nowrap;max-width:160px}
  td.name em{display:block;font-style:normal;font-weight:400;font-size:11px;opacity:.5;white-space:normal;margin-top:2px}
  .ico{border-radius:22.37%;display:inline-block}
  .mask{border-radius:50%;display:inline-block}
  .big{image-rendering:pixelated}
  tr+tr td{border-top:1px solid #ffffff12}
</style>

<h1>홈코트 앱 아이콘 시안 v3 — 가장 작은 크기 검수</h1>
<div class="sub">
  왼쪽 두 열은 <b>실제 크기</b>(40px · 60px)입니다. 오른쪽은 그 40px 그림을 그대로 6배로 늘린 것이라,
  실제 화면에서 무엇이 뭉개지는지 보입니다. 마지막 열은 안드로이드 원형 크롭입니다.
</div>

<table>
  <tr><th></th><th>40px<br>(목록)</th><th>60px<br>(홈 화면)</th><th>40px를 6배로</th><th>원형 크롭 40px</th></tr>
  <tbody id="out"></tbody>
</table>

<script>
function art(line, w){ return `
  <rect x="5" y="9" width="38" height="30" rx="5" stroke="${line}" stroke-width="${2.4*w}" fill="none"/>
  <path d="M5 18h10v12H5" stroke="${line}" stroke-width="${2.4*w}" stroke-linejoin="round" fill="none"/>
  <circle cx="15" cy="24" r="5.5" stroke="#FFA31A" stroke-width="${2.8*w}" fill="none"/>
  <path d="M43 17.5a6.5 6.5 0 0 0 0 13" stroke="${line}" stroke-width="${2.4*w}" fill="none"/>`
}
function svg(line, w, box, inset=1){
  const [x,y,s] = box
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${s} ${s}">
    <rect x="${-x}" y="${-y}" width="200" height="200" fill="#0B0E15"/>
    <g transform="translate(${s/2} ${s/2}) scale(${inset}) translate(${-s/2} ${-s/2})">
      <g transform="translate(${-x} ${-y})">${art(line,w)}</g>
    </g>
  </svg>`
}
const LINE = 'rgba(233,238,247,.80)'
const V = [
  ['C', '로고 전체', LINE, 1.08, [-1.5, 4.5, 51]],
  ['D', '왼쪽 절반 크롭', LINE, 1.0, [0.5, 5.5, 37]],
  ['E', '자유투 서클 중심', LINE, 0.85, [3, 10.5, 26]],
]

const out = document.getElementById('out')
V.forEach(([k, name, line, w, box]) => {
  const url  = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg(line, w, box))
  const murl = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg(line, w, box, 0.8))
  const tr = document.createElement('tr')
  tr.innerHTML = `
    <td class="name">${k}. ${name}<em>영역 [${box.join(', ')}]</em></td>
    <td><img class="ico" src="${url}" width="40" height="40"></td>
    <td><img class="ico" src="${url}" width="60" height="60"></td>
    <td><canvas class="big" data-src="${url}" width="40" height="40"
                style="width:240px;height:240px;border-radius:22.37%"></canvas></td>
    <td><canvas class="big" data-src="${murl}" width="40" height="40"
                style="width:160px;height:160px;border-radius:50%"></canvas></td>`
  out.appendChild(tr)
})
// 40px로 실제 래스터화한 뒤 확대해야 뭉개짐이 그대로 보인다
document.querySelectorAll('canvas').forEach(cv => {
  const im = new Image()
  im.onload = () => cv.getContext('2d').drawImage(im, 0, 0, 40, 40)
  im.src = cv.dataset.src
})
</script>
