<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24.6 24.6" width="24.6" height="24.6" role="img" aria-label="홈코트">
  <!--
    홈코트 앱 아이콘.
    진입 화면 로고(src/components/bits.tsx 의 Logo)와 같은 그림을 가까이서 잡은 것이다.
    좌표는 로고와 같고 잘라낸 영역만 다르다 (48 좌표계에서 [0.535, 11.7, 24.6]).
    로고 전체(가로로 넓은 하프코트)를 그대로 넣으면 코트 테두리가 아이콘 자체의
    둥근 사각형과 겹쳐 40px에서 뭉갠다. 테두리의 둥근 모서리 곡선만 걸치면
    정체불명의 커브가 되므로, 크롭 밖으로 완전히 빼고 페인트존과 자유투 서클만 남겼다.
    선 농도는 스플래시와 같은 ink-3(40%), 굵기는 로고의 0.85배.
    검수 기록: mockup/icon-contact-v1.html ~ v6.html · test/icon/결과-2026-07-31.md
    PNG를 다시 구우려면 test/icon/icon-build.html 을 쓴다. 그 파일의 좌표와 늘 같아야 한다.
  -->
  <rect width="24.6" height="24.6" fill="#0B0E15"/>
  <g transform="translate(-0.535 -11.7)" fill="none" stroke-linejoin="round">
    <path d="M5 18h10v12H5" stroke="rgba(233,238,247,.40)" stroke-width="2.04"/>
    <circle cx="15" cy="24" r="5.5" stroke="#FFA31A" stroke-width="2.38"/>
  </g>
</svg>
