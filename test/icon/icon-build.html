<meta charset="utf-8">
<title>홈코트 아이콘 PNG 굽기</title>
<style>
  body{margin:0;padding:24px;background:#1b1d22;color:#e6e8ee;
       font:13px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
  canvas{background:#000;margin:0 12px 12px 0;vertical-align:top}
  p{opacity:.6;max-width:720px}
</style>
<h3>홈코트 아이콘 PNG 굽기</h3>
<p>
  이 프로젝트에는 이미지 라이브러리가 없다. SVG를 캔버스에 그려 <code>toDataURL</code>로 뽑고,
  그 base64를 Node가 파일로 쓴다. 확정값은 <code>public/favicon.svg</code>와 같다.
  결과는 <code>window.ICONS</code>에 담긴다.
</p>
<div id="v"></div>

<script>
/* public/favicon.svg 와 같은 좌표. 여기서 바꾸면 favicon.svg도 함께 바꿔야 한다.
   1차 출력에서 고친 두 가지:
   ① 코트 테두리(rx=5)의 둥근 모서리 곡선이 크롭 안으로 들어와 정체불명의 커브가 됐다.
      테두리를 크롭 밖으로 완전히 빼고 페인트존 + 자유투 서클만 남긴다.
   ② maskable을 scale()로 줄였더니 잘려 있던 부분이 오히려 드러났다.
      크롭 경계로 clipPath를 씌운 뒤 그 결과를 줄여야 한다. */
const BOX = { x: 0.535, y: 11.7, side: 24.6 }
const LINE = 'rgba(233,238,247,.40)'
const BG = '#0B0E15'

function iconSVG(inset){
  const s = BOX.side
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${s} ${s}" width="${s}" height="${s}">
    <defs><clipPath id="crop"><rect width="${s}" height="${s}"/></clipPath></defs>
    <rect width="${s}" height="${s}" fill="${BG}"/>
    <g transform="translate(${s/2} ${s/2}) scale(${inset}) translate(${-s/2} ${-s/2})">
      <g clip-path="url(#crop)">
        <rect width="${s}" height="${s}" fill="${BG}"/>
        <g transform="translate(${-BOX.x} ${-BOX.y})" fill="none" stroke-linejoin="round">
          <path d="M5 18h10v12H5" stroke="${LINE}" stroke-width="2.04"/>
          <circle cx="15" cy="24" r="5.5" stroke="#FFA31A" stroke-width="2.38"/>
        </g>
      </g>
    </g>
  </svg>`
}

/* maskable은 가장자리 10%를 비운다 = 그림을 0.8배로 줄이고 배경만 꽉 채운다 */
const JOBS = [
  ['icon-192.png',          192, 1],
  ['icon-512.png',          512, 1],
  ['icon-512-maskable.png', 512, 0.8],
]

window.ICONS = {}
const v = document.getElementById('v')
let left = JOBS.length
for (const [name, px, inset] of JOBS){
  const cv = document.createElement('canvas')
  cv.width = cv.height = px
  cv.style.width = cv.style.height = Math.min(px, 180) + 'px'
  v.appendChild(cv)
  const im = new Image()
  im.onload = () => {
    const ctx = cv.getContext('2d')
    ctx.clearRect(0, 0, px, px)
    ctx.drawImage(im, 0, 0, px, px)
    window.ICONS[name] = cv.toDataURL('image/png').split(',')[1]
    if (--left === 0) window.ICONS_READY = true
  }
  im.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(iconSVG(inset))
}
</script>
