<meta charset="utf-8">
<title>히트맵 AWAY 링 대비 검수</title>
<style>
  :root{
    --void:#0B0E15; --ink:#E9EEF7; --buzzer:#FFA31A; --buzzer-fill:#FFA31A; --on-fill:#140C00;
    --line:rgba(233,238,247,.09);
  }
  .light{
    --void:#F7F5F1; --ink:#14171F; --buzzer:#C96A00; --buzzer-fill:#FFA31A; --on-fill:#241300;
    --line:rgba(20,23,31,.10);
  }
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
       background:#222;color:#ddd;padding:24px;display:flex;gap:24px;flex-wrap:wrap}
  .pane{background:var(--void);color:var(--ink);border-radius:18px;padding:20px 22px;width:392px}
  h2{font-size:13px;letter-spacing:.1em;margin:0 0 14px;opacity:.55;font-weight:700}
  h3{font-size:12px;margin:18px 0 8px;opacity:.8;font-weight:700}
  .row{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
  .cap{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:5px}
  .cap span{font-size:8px;text-align:center;opacity:.5;line-height:1.25}
  .cell{height:30px;border-radius:6px;display:grid;place-items:center;
        font:600 10px/1 -apple-system,sans-serif}
  /* 배경 4단계 */
  .b0{background:color-mix(in srgb,var(--ink) 4%,transparent);color:rgba(233,238,247,.24)}
  .light .b0{color:rgba(20,23,31,.26)}
  .b1{background:rgba(255,163,26,.30)}
  .b2{background:rgba(255,163,26,.55)}
  .b3{background:var(--buzzer-fill);color:var(--on-fill)}
  /* AWAY 링 후보 */
  .A{box-shadow:inset 0 0 0 1.5px rgba(255,163,26,.75)}
  .B{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ink) 55%,transparent)}
  .C{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ink) 75%,transparent)}
  .D{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ink) 75%,transparent),
                inset 0 0 0 3.5px color-mix(in srgb,var(--void) 70%,transparent)}
  .small .cell{height:15px;border-radius:3px;font-size:0}
</style>

<div class="pane">
  <h2>다크 (기본)</h2>
  <div id="dk"></div>
</div>
<div class="pane light">
  <h2>라이트</h2>
  <div id="lt"></div>
</div>

<script>
const BG = ['b0','b1','b2','b3']
const BGNAME = ['기록없음','타임아웃','기본','풀']
const CAND = [
  ['A','현재 · 앰버 75% 1.5px'],
  ['B','ink 55% 2px'],
  ['C','ink 75% 2px'],
  ['D','ink 75% + 배경색 안쪽선'],
]
function build(el){
  let h = ''
  for (const [k,label] of CAND){
    h += `<h3>${label}</h3><div class="row">`
    for (let i=0;i<4;i++) h += `<div class="cell ${BG[i]}">14</div>`
    for (let i=0;i<4;i++) h += `<div class="cell ${BG[i]} ${k}">14</div>`
    h += `</div><div class="cap">`
    for (let i=0;i<4;i++) h += `<span>${BGNAME[i]}</span>`
    for (let i=0;i<4;i++) h += `<span>${BGNAME[i]}<br>+원정</span>`
    h += `</div>`
    // 실제 쓰이는 가장 작은 크기(칸 절반)에서도 구별되는지
    h += `<div class="row small" style="margin-top:6px">`
    for (let i=0;i<4;i++) h += `<div class="cell ${BG[i]}"></div>`
    for (let i=0;i<4;i++) h += `<div class="cell ${BG[i]} ${k}"></div>`
    h += `</div>`
  }
  el.innerHTML = h
}
build(document.getElementById('dk'))
build(document.getElementById('lt'))
</script>
