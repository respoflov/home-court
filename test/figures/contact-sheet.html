<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>홈코트 — 동작 그림 콘택트 시트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{--void:#0B0E15;--surface:#12161F;--line:rgba(233,238,247,.09);--line-2:rgba(233,238,247,.16);
--ink:#E9EEF7;--ink-2:rgba(233,238,247,.62);--ink-3:rgba(233,238,247,.40);--ink-4:rgba(233,238,247,.24);--buzzer:#FFA31A}
*{box-sizing:border-box;margin:0}
body{background:#07090E;color:var(--ink);font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;padding:32px;-webkit-font-smoothing:antialiased}
h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--ink-3);font-size:13px;margin:6px 0 26px}
h2{font-size:11px;font-weight:700;letter-spacing:.11em;color:var(--ink-3);margin:34px 0 14px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.cell .nm{font-size:11px;color:var(--ink-3);margin-top:6px;line-height:1.4}
.cell .id{font-size:9px;color:var(--ink-4);font-family:ui-monospace,Menlo,monospace}
.tiny{display:flex;flex-wrap:wrap;gap:7px}
.tiny .t{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:5px;display:grid;place-items:center}
/* ── 동작 그림 ─────────────────────────────────────
   규격은 src/data/figures.ts 머리말에. 여기서 벗어나면 42개가 제각각이 된다. */
.fig g { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.fig .ts { stroke: var(--ink-2); stroke-width: 8; }
.fig .lb { stroke: var(--ink-2); stroke-width: 6; }
.fig .fr { stroke: var(--ink-2); stroke-width: 6; opacity: .3; }
.fig .hd { stroke: var(--ink-2); stroke-width: 5.5; fill: none; }
.fig .ft { stroke: var(--ink-2); stroke-width: 5.5; }
.fig .cu { stroke: var(--buzzer); stroke-width: 6; }
.fig .ld { fill: var(--buzzer); stroke: none; }
.fig .gr2 { stroke: var(--line-2); stroke-width: 3.5; fill: none; }
.fig > .gr { stroke: var(--line-2); stroke-width: 3.5; fill: none; }
.fig .fB { opacity: 0; }

/* 두 자세 교차는 운동 중 화면에서만. 목록에서 여럿이 동시에 움직이면 산만하다. */
.fig-anim .fA { animation: figSwap 2.6s infinite; }
.fig-anim .fB { animation: figSwap 2.6s infinite; animation-delay: 1.3s; }
@keyframes figSwap {
  0%, 42% { opacity: 1 }
  50%, 92% { opacity: 0 }
  100% { opacity: 1 }
}
@media (prefers-reduced-motion: reduce) {
  .fig-anim .fA { animation: none; opacity: 1 }
  .fig-anim .fB { animation: none; opacity: 0 }
}


</style></head><body>
